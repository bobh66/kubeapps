syntax = "proto3";
package kubeappsapis.plugins.crossplane.packages.v1alpha1;
option go_package = "github.com/SAP/kubeapps/cmd/kubeapps-apis/gen/plugins/crossplane/packages/v1alpha1";

import "google/api/annotations.proto";
import "kubeappsapis/core/packages/v1alpha1/packages.proto";
import "kubeappsapis/core/packages/v1alpha1/repositories.proto";

service CrossplanePackagesService {
  // GetAvailablePackageSummaries returns the available packages managed by the 'crossplane' plugin
  rpc GetAvailablePackageSummaries(kubeappsapis.core.packages.v1alpha1.GetAvailablePackageSummariesRequest) returns (kubeappsapis.core.packages.v1alpha1.GetAvailablePackageSummariesResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/availablepackages"
    };
  };

  // GetAvailablePackageDetail returns the package metadata managed by the 'crossplane' plugin
  rpc GetAvailablePackageDetail(kubeappsapis.core.packages.v1alpha1.GetAvailablePackageDetailRequest) returns (kubeappsapis.core.packages.v1alpha1.GetAvailablePackageDetailResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/availablepackages/c/{available_package_ref.context.cluster}/ns/{available_package_ref.context.namespace}/{available_package_ref.identifier=**}"
    };
  };

  // GetAvailablePackageVersions returns the package versions managed by the 'crossplane' plugin
  rpc GetAvailablePackageVersions(kubeappsapis.core.packages.v1alpha1.GetAvailablePackageVersionsRequest) returns (kubeappsapis.core.packages.v1alpha1.GetAvailablePackageVersionsResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/availablepackages/c/{available_package_ref.context.cluster}/ns/{available_package_ref.context.namespace}/{available_package_ref.identifier=**}/versions"
    };
  }

  // GetInstalledPackageSummaries returns the installed packages managed by the 'crossplane' plugin
  rpc GetInstalledPackageSummaries(kubeappsapis.core.packages.v1alpha1.GetInstalledPackageSummariesRequest) returns (kubeappsapis.core.packages.v1alpha1.GetInstalledPackageSummariesResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/installedpackages"
    };
  }

  // GetInstalledPackageDetail returns the requested installed package managed by the 'crossplane' plugin
  rpc GetInstalledPackageDetail(kubeappsapis.core.packages.v1alpha1.GetInstalledPackageDetailRequest) returns (kubeappsapis.core.packages.v1alpha1.GetInstalledPackageDetailResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/installedpackages/c/{installed_package_ref.context.cluster}/ns/{installed_package_ref.context.namespace}/{installed_package_ref.identifier}"
    };
  }

  // CreateInstalledPackage creates an installed package based on the request.
  rpc CreateInstalledPackage(kubeappsapis.core.packages.v1alpha1.CreateInstalledPackageRequest) returns (kubeappsapis.core.packages.v1alpha1.CreateInstalledPackageResponse) {
    option (google.api.http) = {
      post: "/plugins/crossplane/packages/v1alpha1/installedpackages"
      body: "*"
    };
  }

  // UpdateInstalledPackage updates an installed package based on the request.
  rpc UpdateInstalledPackage(kubeappsapis.core.packages.v1alpha1.UpdateInstalledPackageRequest) returns (kubeappsapis.core.packages.v1alpha1.UpdateInstalledPackageResponse) {
    option (google.api.http) = {
      put: "/plugins/crossplane/packages/v1alpha1/installedpackages/c/{installed_package_ref.context.cluster}/ns/{installed_package_ref.context.namespace}/{installed_package_ref.identifier}"
      body: "*"
    };
  }

  // DeleteInstalledPackage deletes an installed package based on the request.
  rpc DeleteInstalledPackage(kubeappsapis.core.packages.v1alpha1.DeleteInstalledPackageRequest) returns (kubeappsapis.core.packages.v1alpha1.DeleteInstalledPackageResponse) {
    option (google.api.http) = {
      delete: "/plugins/crossplane/packages/v1alpha1/installedpackages/c/{installed_package_ref.context.cluster}/ns/{installed_package_ref.context.namespace}/{installed_package_ref.identifier}"
    };
  }

  // GetInstalledPackageResourceRefs returns the references for the Kubernetes
  // resources created by an installed package.
  rpc GetInstalledPackageResourceRefs(kubeappsapis.core.packages.v1alpha1.GetInstalledPackageResourceRefsRequest) returns (kubeappsapis.core.packages.v1alpha1.GetInstalledPackageResourceRefsResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/installedpackages/c/{installed_package_ref.context.cluster}/ns/{installed_package_ref.context.namespace}/{installed_package_ref.identifier}/resourcerefs"
    };
  }
}

service CrossplaneRepositoriesService {
  // AddPackageRepository add an existing package repository to the set of ones already managed by the
  // 'crossplane' plugin
  rpc AddPackageRepository(kubeappsapis.core.packages.v1alpha1.AddPackageRepositoryRequest) returns (kubeappsapis.core.packages.v1alpha1.AddPackageRepositoryResponse) {
    option (google.api.http) = {
      post: "/plugins/crossplane/packages/v1alpha1/repositories"
      body: "*"
    };
   }

  rpc GetPackageRepositoryDetail(kubeappsapis.core.packages.v1alpha1.GetPackageRepositoryDetailRequest) returns (kubeappsapis.core.packages.v1alpha1.GetPackageRepositoryDetailResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/repositories/c/{package_repo_ref.context.cluster}/ns/{package_repo_ref.context.namespace}/{package_repo_ref.identifier=**}"
    };
  }

  rpc GetPackageRepositorySummaries(kubeappsapis.core.packages.v1alpha1.GetPackageRepositorySummariesRequest) returns (kubeappsapis.core.packages.v1alpha1.GetPackageRepositorySummariesResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/repositories"
    };
  }

  rpc UpdatePackageRepository(kubeappsapis.core.packages.v1alpha1.UpdatePackageRepositoryRequest) returns (kubeappsapis.core.packages.v1alpha1.UpdatePackageRepositoryResponse) {
    option (google.api.http) = {
      put: "/plugins/crossplane/packages/v1alpha1/repositories/c/{package_repo_ref.context.cluster}/ns/{package_repo_ref.context.namespace}/{package_repo_ref.identifier=**}"
      body: "*"
     };
  }

  rpc DeletePackageRepository(kubeappsapis.core.packages.v1alpha1.DeletePackageRepositoryRequest) returns (kubeappsapis.core.packages.v1alpha1.DeletePackageRepositoryResponse) {
    option (google.api.http) = {
      delete: "/plugins/crossplane/packages/v1alpha1/repositories/c/{package_repo_ref.context.cluster}/ns/{package_repo_ref.context.namespace}/{package_repo_ref.identifier=**}"
    };
  }

  rpc GetPackageRepositoryPermissions(kubeappsapis.core.packages.v1alpha1.GetPackageRepositoryPermissionsRequest) returns (kubeappsapis.core.packages.v1alpha1.GetPackageRepositoryPermissionsResponse) {
    option (google.api.http) = {
      get: "/plugins/crossplane/packages/v1alpha1/repositories/c/{context.cluster}/permissions"
    };
  }
}

// CrossplanePackageCustomDetail
//
// Custom details for a Crossplane package derived from an XRD.
message CrossplanePackageCustomDetail {
  // XRD name (metadata.name of the CompositeResourceDefinition).
  string xrd_name = 1;
  // Deployable API group.
  string deploy_group = 2;
  // Deployable API version.
  string deploy_version = 3;
  // Deployable API kind (claim or composite).
  string deploy_kind = 4;
  // Resource scope: Namespaced or Cluster.
  string scope = 5;
  // Composite API group when deploying a claim.
  string composite_group = 6;
  // Composite API version when deploying a claim.
  string composite_version = 7;
  // Composite API kind when deploying a claim.
  string composite_kind = 8;
}

// CrossplaneInstalledPackageCustomDetail
//
// Custom details for an installed Crossplane claim or composite resource.
message CrossplaneInstalledPackageCustomDetail {
  // Resource name.
  string resource_name = 1;
  // Resource namespace (empty for cluster-scoped resources).
  string resource_namespace = 2;
  // Resource generation.
  int64 generation = 3;
  // Summary of the latest Ready condition message, if any.
  string ready_condition_message = 4;
}
